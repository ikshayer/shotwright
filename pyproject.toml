[project]
name = "cctv-pipeline"
version = "0.1.0"
description = "Local agent-operated CCTV analog-horror production pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Imported directly by orchestrator/api/cli.py; previously only transitive.
    "click>=8.1",
    # Required by FastAPI to accept the multipart upload route (FR-25 validation).
    "python-multipart>=0.0.9",
    "nvidia-ml-py>=12",
    "psutil>=5.9",
    "Pillow>=10.0",
]

[project.scripts]
cctv-pipeline = "orchestrator.api.cli:main"
cctv-pipeline-mcp = "orchestrator.api.mcp:main"
cctv-pipeline-serve = "orchestrator.api.launch:main"

[tool.setuptools.packages.find]
# Without this, setuptools' flat-layout discovery also finds spikes/ and references/
# beside orchestrator/ and refuses to build at all.
include = ["orchestrator*"]

[tool.setuptools.package-data]
"orchestrator.api" = ["mcp_resources/*.md"]
"orchestrator" = ["assets/fonts/*.ttf", "assets/fonts/LICENSE"]

[project.optional-dependencies]
# httpx2 backs starlette.testclient (Starlette 1.x); without it the API tests fail to collect.
dev = ["pytest>=8", "pytest-cov>=5", "httpx2>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
