[project]
name = "cctv-pipeline"
version = "0.1.0"
description = "Local agent-operated CCTV analog-horror production pipeline"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
